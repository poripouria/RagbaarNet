<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Music Generation Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Input Source Selection Modal -->
    <div id="inputModal" class="modal">
        <div class="modal-content">
            <h2>Choose Input Source</h2>
            <div class="input-buttons">
                <button class="input-btn" onclick="selectInputSource('phone_camera')" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); selectInputSource('phone_camera');}">📷 Camera</button>
                <button class="input-btn" onclick="selectInputSource('video_file')" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); selectInputSource('video_file');}">🎥 Video File</button>
                <button class="input-btn" onclick="selectInputSource('screen_record')" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); selectInputSource('screen_record');}">📱 Screen Record</button>
                <button class="input-btn" onclick="selectInputSource('network_stream')" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); selectInputSource('network_stream');}">🌐 Network Stream</button>
            </div>
        </div>
    </div>

    <!-- URL Input Modal -->
    <div id="urlModal" class="url-modal">
        <div class="url-modal-content">
            <h3>Enter DashCam Stream URL:</h3>
            <input type="text" id="streamUrl" class="url-input" placeholder="http://192.168.1.100:8080/video">
            <div class="url-buttons">
                <button class="url-btn confirm-btn" onclick="confirmUrl()" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); confirmUrl();}">Confirm</button>
                <button class="url-btn cancel-btn" onclick="cancelUrl()" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); cancelUrl();}">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Music Settings Modal -->
    <div id="musicianModal" class="musician-modal">
        <div class="musician-modal-content">
            <div class="musician-modal-header">
                <div class="musician-modal-header-text">
                    <h2>🎵 Music Settings</h2>
                    <div id="musicianModalStatus" class="musician-modal-status" role="status" aria-live="polite"></div>
                </div>
                <div class="musician-modal-header-actions">
                    <button id="musicianApplyBtn" class="url-btn confirm-btn" onclick="applyMusicSettings()" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); applyMusicSettings();}">Apply</button>
                    <button id="musicianCloseBtn" class="url-btn cancel-btn" onclick="closeMusicianModal()" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); closeMusicianModal();}">Close</button>
                </div>
            </div>

            <div class="musician-modal-body">
                <section class="music-settings-section">
                    <h3>Musician</h3>
                    <div id="musicianList" class="musician-list"></div>
                </section>

                <section id="instrumentSettings" class="music-settings-section" hidden>
                    <label class="music-settings-label">Choose Instrument</label>
                    <div id="instrumentList" class="instrument-list" role="listbox" aria-label="Choose LSTM instrument"></div>
                </section>

                <section class="music-settings-section">
                    <h3>Tempo (BPM): <span id="tempoDerivedValue">120</span> derived from Car Speed (<span id="speedDerivedValue">12</span> km/h)</h3>
                    <div class="tempo-mode-toggle" role="radiogroup" aria-label="Speed source">
                        <label class="tempo-mode-option">
                            <input type="radio" name="tempoMode" id="tempoModeSlider" value="slider" checked>
                            <span>Slider</span>
                        </label>
                        <label class="tempo-mode-option tempo-mode-option-disabled">
                            <input type="radio" name="tempoMode" id="tempoModeAuto" value="auto" disabled>
                            <span>Auto (car speed sensor - coming soon)</span>
                        </label>
                    </div>
                    <div class="tempo-control-group">
                        <div class="tempo-slider-row">
                            <input type="range" id="speedSlider" class="tempo-slider" min="0" max="160" step="1" value="12" aria-label="Car speed slider (km/h)">
                            <input type="number" id="speedNumberInput" class="tempo-number-input" min="0" max="160" step="1" value="12" aria-label="Car speed value (km/h)">
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Main Interface -->
    <div class="menu-frame" id="menuFrame" style="display: none;">
        <div class="title">RagbaarNet AI</div>
        
        <button class="music-gen-btn" onclick="startMusicGeneration()" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); startMusicGeneration();}">🎵 Generate Music</button>
        
        <div class="button-group">
            <button class="menu-btn" id="changeSourceBtn" onclick="changeInputSource()" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); changeInputSource();}">📂 Change Source</button>
            <button class="menu-btn" id="musicSettingsBtn" onclick="openMusicianModal()" ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); openMusicianModal();}">🎵 Music Settings</button>
        </div>

        <div class="volume-control-group">
            <label for="volumeSlider" class="volume-label">Volume</label>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" step="2" value="70" aria-label="Volume slider">
        </div>

        <div class="status-section">
            <div class="status-label">Status:</div>
            <div class="status-text" id="statusText">Ready</div>
            <div class="roi-info" id="roiInfo"></div>
        </div>
    </div>

    <div class="display-frame" id="displayFrame" style="display: none;">
        <div class="video-container" id="videoContainer">
            <video id="videoElement" class="video-element" autoplay playsinline muted loop></video>
            <canvas id="segmentationCanvas" class="canvas-overlay" style="display: none; pointer-events: none;"></canvas>
            <!-- <canvas id="detectionCanvas" class="canvas-overlay"></canvas> -->
            <canvas id="roiCanvas" class="canvas-overlay"></canvas>
            <div id="roiPointTooltip" class="roi-point-tooltip"></div>
        </div>
        
        <div class="instructions-wrapper">
            <div class="instructions">
                <span id="instructionsText">Drag green points to adjust ROI corners • Drag cyan points to control edge curves</span>
            </div>
            <button
                id="toggleSegmentationBtn"
                class="roi-fill-toggle"
                type="button"
                onclick="toggleFrameProcessing()"
                ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); toggleFrameProcessing();}"
                aria-label="Toggle segmentation view"
                aria-pressed="false"
                title="Segmentation view: OFF (tap to toggle)"
            >
                <img
                    id="toggleSegmentationBtnImg"
                    class="roi-fill-toggle__img"
                    src="../../assets/icons/segment.png"
                    alt=""
                    aria-hidden="true"
                    draggable="false"
                >
            </button>
            <button
                id="toggleRoiFillIcon"
                class="roi-fill-toggle"
                type="button"
                onclick="toggleRoiFill()"
                ontouchend="if(event.target===this && isMobileDevice()){event.preventDefault(); toggleRoiFill();}"
                aria-label="Toggle ROI area transparency (hold to reset ROI)"
                title="ROI area: Filled (tap for transparent, hold to reset ROI)"
            >
                <img
                    id="toggleRoiFillIconImg"
                    class="roi-fill-toggle__img"
                    src="../../assets/icons/Transparent%20Icon.png"
                    alt=""
                    aria-hidden="true"
                    draggable="false"
                >
            </button>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="videoFileInput" class="hidden-input" accept="video/*">

    <!-- External Libraries -->

    <!-- Socket.IO is used for real-time communication between the client and server, enabling features such as live status updates and streaming control. -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Tone.js is a powerful library for creating and manipulating audio in the browser. It provides a high-level interface for generating sounds, scheduling
      events, and applying effects, making it ideal for music generation applications. -->
    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    
    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
