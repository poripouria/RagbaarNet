<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RagbaarNet — Typing Channel</title>
<style>
    :root {
        --bg-primary: #1a1a1a;
        --bg-editor: #1e1e1e;
        --bg-gutter: #1a1a1a;
        --bg-titlebar: #2d2d2d;
        --accent: #00ff88;
        --text-primary: #d4d4d4;
        --text-muted: #6a6a6a;
        --border-color: #3a3a3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: 'Segoe UI', Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* --- title bar, mimicking a code editor window ------------------------ */
    .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: var(--bg-titlebar);
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
    }

    .titlebar-left {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .traffic-lights { display: flex; gap: 7px; }
    .traffic-lights span {
        width: 11px; height: 11px; border-radius: 50%; display: inline-block;
    }
    .traffic-lights .red { background: #ff5f56; }
    .traffic-lights .yellow { background: #ffbd2e; }
    .traffic-lights .green { background: #27c93f; }

    .titlebar-title {
        font-size: 13px;
        color: var(--text-muted);
    }

    .titlebar-title strong { color: var(--text-primary); }

    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-muted);
    }

    .status-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #ff5f56;
        transition: background 0.2s ease;
    }
    .status-dot.connected { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    /* --- editor area -------------------------------------------------------- */
    .editor-wrapper {
        flex: 1;
        display: flex;
        overflow: hidden;
    }

    .gutter {
        width: 48px;
        padding: 16px 0;
        text-align: right;
        background: var(--bg-gutter);
        color: var(--text-muted);
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        line-height: 1.6;
        user-select: none;
        overflow: hidden;
        flex-shrink: 0;
    }

    .gutter div { padding-right: 12px; }

    #editor {
        flex: 1;
        background: var(--bg-editor);
        color: var(--text-primary);
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        line-height: 1.6;
        padding: 16px;
        border: none;
        outline: none;
        resize: none;
        tab-size: 4;
        white-space: pre;
    }

    /* --- bottom status bar --------------------------------------------------- */
    .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        background: var(--bg-titlebar);
        border-top: 1px solid var(--border-color);
        font-size: 12px;
        color: var(--text-muted);
        flex-shrink: 0;
    }

    .statusbar-group { display: flex; align-items: center; gap: 18px; }

    .held-keys {
        display: flex;
        gap: 4px;
        min-height: 20px;
    }

    .held-key {
        background: rgba(0, 255, 136, 0.15);
        border: 1px solid var(--accent);
        color: var(--accent);
        border-radius: 4px;
        padding: 1px 6px;
        font-family: 'Consolas', monospace;
        font-size: 11px;
    }

    .note-count strong { color: var(--accent); }

    .connection-status {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    /* --- start-engine overlay (Web Audio needs a user gesture) --------------- */
    .start-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
    }

    .start-btn {
        background: var(--accent);
        color: #0a0a0a;
        border: none;
        border-radius: 10px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 255, 136, 0.3);
    }
    .start-btn:hover { filter: brightness(1.08); }

    .volume-control {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .volume-control input[type="range"] {
        width: 80px;
        accent-color: var(--accent);
    }

    /* Small square icon buttons (save, stop) instead of wide text buttons */
    .icon-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        border-radius: 4px;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        cursor: pointer;
        padding: 0;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.stop-btn:hover { border-color: #ff5f56; color: #ff5f56; }

    /* Editable filename in the title bar - looks like plain text until you
       notice the dashed underline, then it's obviously an input. */
    .filename-input {
        background: transparent;
        border: none;
        border-bottom: 1px dashed transparent;
        color: var(--text-primary);
        font-size: 13px;
        font-family: inherit;
        padding: 0 1px;
        outline: none;
    }
    .filename-input:hover,
    .filename-input:focus {
        border-bottom-color: var(--text-muted);
    }

    /* --- syntax-highlighted editor -------------------------------------------
       Classic overlay trick: a real <textarea> sits on top with invisible text
       (just a visible caret), while a Prism-highlighted <pre><code> underneath,
       kept pixel-identical (same font/padding/line-height) and scroll-synced,
       shows the colored text through it. */
    .code-area {
        position: relative;
        flex: 1;
        overflow: hidden;
    }

    .highlight-pre,
    .highlight-pre code[class*="language-"] {
        margin: 0 !important;
        background: transparent !important;
        font-family: 'Consolas', 'Courier New', monospace !important;
        font-size: 14px !important;
        line-height: 1.6 !important;
        white-space: pre !important;
        tab-size: 4;
        text-shadow: none !important;
    }

    .highlight-pre {
        position: absolute;
        inset: 0;
        padding: 16px !important;
        overflow: hidden;
        pointer-events: none;
    }

    #editor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: transparent;
        caret-color: var(--accent);
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        line-height: 1.6;
        padding: 16px;
        border: none;
        outline: none;
        resize: none;
        tab-size: 4;
        white-space: pre;
    }

    #editor::placeholder {
        color: var(--text-muted);
        opacity: 1;
    }
</style>
</head>
<body>

    <div class="start-overlay" id="startOverlay">
        <button class="start-btn" id="startBtn">🎵 Start Music Engine</button>
    </div>

    <div class="titlebar">
        <div class="titlebar-left">
            <div class="traffic-lights">
                <span class="red"></span><span class="yellow"></span><span class="green"></span>
            </div>
            <div class="titlebar-title">
                <strong>RagbaarNet</strong> —
                <input type="text" id="filenameInput" class="filename-input" value="session.js"
                    spellcheck="false" autocomplete="off" autocapitalize="off"
                    title="Click to rename (also picks the syntax highlighting)">
            </div>
        </div>
        <div class="status">
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="40">
                <span id="volumeLabel">40%</span>
            </div>
            <button class="icon-btn" id="saveBtn" title="Save as file (Ctrl+S)">💾</button>
            <button class="icon-btn stop-btn" id="stopBtn" title="Silence everything immediately">⏹</button>
        </div>
    </div>

    <div class="editor-wrapper">
        <div class="gutter" id="gutter"><div>1</div></div>
        <div class="code-area">
            <pre id="highlightPre" class="highlight-pre" aria-hidden="true"><code id="highlightCode" class="language-javascript"></code></pre>
            <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
                placeholder=
"// Start typing and enjoy your performance! Each key press sends a NOTE_ON/NOTE_OFF to the processor.
function ragbaarNet(scene) {
    return generateMusic(scene);
}"
            ></textarea>
        </div>
    </div>

    <div class="statusbar">
        <div class="statusbar-group">
            <span>Last key: <strong id="lastKey">—</strong></span>
            <span class="note-count">Notes sent: <strong id="noteCount">0</strong></span>
            <span class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting…</span>
            </span>
        </div>
        <div class="held-keys" id="heldKeys"></div>
    </div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<!-- Same audio pipeline the main video UI uses (Tone.js mixing chain, per-instrument
     voice factories, reverb sends, polyphony limiter, handleMusicEvents/playMusicEvent).
     Served from modules/Platform/js/ via the existing /ui/<filename> static route, so
     this is the SAME code running, not a parallel reimplementation. core.js must load
     first - audio-engine.js reads its globals (currentTempo, currentVolume, etc.) at load time. -->
<script src="/ui/js/core.js"></script>
<script src="/ui/js/audio-engine.js"></script>
<script src="/ui/js/beat-generator.js"></script>
<script>
    // --- Syntax highlighting (Prism.js), driven entirely by the filename's
    // extension - no hardcoded language, no dropdown to keep in sync by hand.
    Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';

    const LANGUAGE_BY_EXT = {
        py: 'python',
        cpp: 'cpp', cc: 'cpp', cxx: 'cpp', hpp: 'cpp', h: 'cpp',
        c: 'c',
        html: 'markup', htm: 'markup', xml: 'markup',
        js: 'javascript', jsx: 'javascript', ts: 'javascript', tsx: 'javascript',
        json: 'json', css: 'css', md: 'markdown', java: 'java', cs: 'csharp',
    };

    function detectLanguage(filename) {
        const ext = (filename.split('.').pop() || '').toLowerCase();
        return LANGUAGE_BY_EXT[ext] || 'javascript';
    }

    const highlightCode = document.getElementById('highlightCode');
    const highlightPre = document.getElementById('highlightPre');
    const filenameInput = document.getElementById('filenameInput');

    function updateHighlight() {
        highlightCode.className = `language-${detectLanguage(filenameInput.value)}`;
        // Trailing newline keeps the <pre>'s height honest when the last line is empty.
        highlightCode.textContent = editor.value + '\n';
        Prism.highlightElement(highlightCode);
    }

    // --- Shims for the two small pieces of UI.html/main.js that audio-engine.js's
    // initializeAudioSystem() expects but that live outside core.js/audio-engine.js
    // (main.js isn't loaded here - it also wires up ROI/video, which this page doesn't need).
    function updateVolumeControls(vol) {
        const label = document.getElementById('volumeLabel');
        if (label) label.textContent = `${vol}%`;
    }

    function handleVolumeSliderInput(e) {
        currentVolume = clampVolumeValue(e.target.value);
        if (masterGain) masterGain.gain.rampTo(currentVolume / 100, 0.05);
        updateVolumeControls(currentVolume);
    }

    // --- Processor connection (same host-detection logic as the main UI) -----
    const processorUrl = detectProcessorUrl(); // from core.js
    const socket = io(processorUrl, {
        timeout: 10000,
        reconnection: true,
        reconnectionAttempts: 10,
        reconnectionDelay: 2000,
    });

    const statusDot = document.getElementById('statusDot');
    const statusTextEl = document.getElementById('statusText');

    socket.on('connect', () => {
        statusDot.classList.add('connected');
        statusTextEl.textContent = 'Connected — typing channel active';
    });

    socket.on('disconnect', () => {
        statusDot.classList.remove('connected');
        statusTextEl.textContent = 'Disconnected';
    });

    socket.on('connect_error', () => {
        statusTextEl.textContent = 'Connection error — is main.py running?';
    });

    // The actual sound: hand every music_update straight to audio-engine.js's own
    // handler. It schedules playMusicEvent() per event (note_on -> triggerAttack,
    // note_off -> stopNote) and updates the shared status line via updateMusicInfo().
    let noteCount = 0;
    const noteCountEl = document.getElementById('noteCount');
    socket.on('music_update', (data) => {
        noteCount += (data.events_count || 0);
        noteCountEl.textContent = noteCount;
        handleMusicEvents(data);
    });

    // --- Start-engine gesture (Web Audio requires a real user interaction) -----
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');

    startBtn.addEventListener('click', async () => {
        try {
            await Tone.start();
            initializeAudioSystem();          // builds the mastering chain + instrument factories
            isMusicGenerationActive = true;   // audio-engine.js checks this before playing tonal notes
            Tone.Transport.bpm.value = currentTempo;
            Tone.Transport.start();
            initBeatGenerator();
            startOverlay.style.display = 'none';
            editor.focus();
            console.log('🎵 Audio engine started');
        } catch (err) {
            console.error('❌ Failed to start audio engine:', err);
            statusTextEl.textContent = 'Failed to start audio — see console';
        }
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
        if (typeof hardStopAllAudio === 'function') {
            hardStopAllAudio();
            stopBeatGenerator();
        }
    });

    // --- Save (downloads the buffer under whatever name is in the title bar) ---
    function saveFile() {
        const filename = filenameInput.value.trim() || 'session.txt';
        const blob = new Blob([editor.value], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    document.getElementById('saveBtn').addEventListener('click', saveFile);

    // Filename drives syntax highlighting (see detectLanguage above) and
    // auto-sizes to its own content so it doesn't look like a fixed-width box.
    function resizeFilenameInput() {
        filenameInput.size = Math.max(6, filenameInput.value.length);
    }
    filenameInput.addEventListener('input', () => {
        resizeFilenameInput();
        updateHighlight();
    });
    resizeFilenameInput();

    // --- Keystroke capture -----------------------------------------------------
    const editor = document.getElementById('editor');
    const lastKeyEl = document.getElementById('lastKey');
    const heldKeysEl = document.getElementById('heldKeys');
    const heldKeys = new Set();

    function sendEvent(type, key) {
        socket.emit('input_event', {
            source: 'typing',
            payload: { type, key },
            timestamp: Date.now() / 1000,
        });
    }

    function renderHeldKeys() {
        heldKeysEl.innerHTML = Array.from(heldKeys)
            .map(k => `<span class="held-key">${k === ' ' ? 'space' : k}</span>`)
            .join('');
    }

    editor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.slice(0, start) + '\t' + editor.value.slice(end);
            editor.selectionStart = editor.selectionEnd = start + 1;
            updateGutter();
            updateHighlight();
        }

        // Ctrl/Cmd+S saves instead of triggering the browser's "Save Page" dialog.
        // The keystroke still counts musically (see below) - it's a real keypress.
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            saveFile();
        }

        // Ignore OS key-repeat: we only want one NOTE_ON per physical press.
        if (e.repeat) return;

        const key = e.key.toLowerCase();
        heldKeys.add(key);
        renderHeldKeys();
        lastKeyEl.textContent = e.key === ' ' ? 'space' : e.key;

        sendEvent('keydown', key);
    });

    editor.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        heldKeys.delete(key);
        renderHeldKeys();

        sendEvent('keyup', key);
    });

    // If the editor loses focus mid-keypress (alt-tab, etc.), release
    // everything so Musician doesn't hold a note forever.
    editor.addEventListener('blur', () => {
        heldKeys.forEach(key => sendEvent('keyup', key));
        heldKeys.clear();
        renderHeldKeys();
        releaseScrollSoon.cancel();
        releaseMouseSoon.cancel();
    });

    // --- Scroll -> string, mouse movement -> pad --------------------------------
    function makeGestureTrigger(key, holdMs) {
        let isHeld = false;
        let releaseTimer = null;

        function trigger() {
            if (!isHeld) {
                isHeld = true;
                sendEvent('keydown', key);
            }
            clearTimeout(releaseTimer);
            releaseTimer = setTimeout(() => {
                isHeld = false;
                sendEvent('keyup', key);
            }, holdMs);
        }

        trigger.cancel = () => {
            clearTimeout(releaseTimer);
            if (isHeld) sendEvent('keyup', key);
            isHeld = false;
        };

        return trigger;
    }

    const releaseScrollSoon = makeGestureTrigger('scroll', 250);
    const releaseMouseSoon = makeGestureTrigger('mousemove', 350);

    editor.addEventListener('wheel', () => {
        releaseScrollSoon();
    }, { passive: true });

    // Throttle mousemove sampling - firing on every pixel of movement would
    // flood the socket for no musical benefit.
    let lastMouseSample = 0;
    editor.addEventListener('mousemove', () => {
        const now = Date.now();
        if (now - lastMouseSample < 80) return;
        lastMouseSample = now;
        releaseMouseSoon();
    });

    // --- Fake line-number gutter, synced to content + scroll -------------------
    const gutter = document.getElementById('gutter');

    function updateGutter() {
        const lineCount = editor.value.split('\n').length;
        let html = '';
        for (let i = 1; i <= lineCount; i++) html += `<div>${i}</div>`;
        gutter.innerHTML = html;
    }

    editor.addEventListener('input', () => {
        updateGutter();
        updateHighlight();
    });
    editor.addEventListener('scroll', () => {
        gutter.scrollTop = editor.scrollTop;
        highlightPre.scrollTop = editor.scrollTop;
        highlightPre.scrollLeft = editor.scrollLeft;
    });

    updateGutter();
    updateHighlight();
</script>

</body>
</html>
