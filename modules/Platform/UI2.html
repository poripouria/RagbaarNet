<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RagbaarNet — Typing Channel</title>
<style>
    :root {
        --bg-primary: #1a1a1a;
        --bg-editor: #1e1e1e;
        --bg-gutter: #1a1a1a;
        --bg-titlebar: #2d2d2d;
        --accent: #00ff88;
        --text-primary: #d4d4d4;
        --text-muted: #6a6a6a;
        --border-color: #3a3a3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: 'Segoe UI', Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* --- title bar, mimicking a code editor window ------------------------ */
    .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: var(--bg-titlebar);
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
    }

    .titlebar-left {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .traffic-lights { display: flex; gap: 7px; }
    .traffic-lights span {
        width: 11px; height: 11px; border-radius: 50%; display: inline-block; cursor: pointer;
    }
    .traffic-lights .red { background: #ff5f56; }
    .traffic-lights .yellow { background: #ffbd2e; }
    .traffic-lights .green { background: #27c93f; }

    .titlebar-title {
        font-size: 13px;
        color: var(--text-muted);
    }

    .titlebar-title strong { color: var(--text-primary); }

    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-muted);
    }

    .status-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #ff5f56;
        transition: background 0.2s ease;
    }
    .status-dot.connected { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    /* --- onboarding tip banner ----------------------------------------------- */
    .tip-banner {
        background: rgba(0, 255, 136, 0.08);
        border-bottom: 1px solid var(--border-color);
        padding: 8px 16px;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--text-primary);
        flex-shrink: 0;
    }
    .tip-banner strong { color: var(--accent); }
    .tip-banner button {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
        padding: 0 4px;
    }
    .tip-banner button:hover { color: var(--text-primary); }

    /* --- editor area -------------------------------------------------------- */
    .editor-wrapper {
        flex: 1;
        display: flex;
        overflow: hidden;
    }

    .gutter {
        width: 48px;
        padding: 16px 0;
        text-align: right;
        background: var(--bg-gutter);
        color: var(--text-muted);
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        line-height: 1.6;
        user-select: none;
        overflow: hidden;
        flex-shrink: 0;
    }

    .gutter div { padding-right: 12px; }

    /* --- bottom status bar --------------------------------------------------- */
    .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        background: var(--bg-titlebar);
        border-top: 1px solid var(--border-color);
        font-size: 12px;
        color: var(--text-muted);
        flex-shrink: 0;
    }

    .statusbar-group { display: flex; align-items: center; gap: 18px; }

    .held-keys {
        display: flex;
        gap: 4px;
        min-height: 20px;
    }

    .held-key {
        background: rgba(0, 255, 136, 0.15);
        border: 1px solid var(--accent);
        color: var(--accent);
        border-radius: 4px;
        padding: 1px 6px;
        font-family: 'Consolas', monospace;
        font-size: 11px;
    }

    .note-count strong { color: var(--accent); }

    .connection-status {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .volume-control {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .volume-control input[type="range"] {
        width: 80px;
        accent-color: var(--accent);
    }

    /* Small square icon buttons (save, stop) instead of wide text buttons */
    .icon-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        border-radius: 4px;
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        cursor: pointer;
        padding: 0;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.stop-btn.playing:hover { border-color: #ff5f56; color: #ff5f56; }

    /* Editable filename in the title bar - looks like plain text until you
       notice the dashed underline, then it's obviously an input. */
    .filename-input {
        background: transparent;
        border: none;
        border-bottom: 1px dashed transparent;
        color: var(--text-primary);
        font-size: 13px;
        font-family: inherit;
        padding: 0 1px;
        outline: none;
    }
    .filename-input:hover,
    .filename-input:focus {
        border-bottom-color: var(--text-muted);
    }

    /* --- syntax-highlighted editor ------------------------------------------- */
    .code-area {
        position: relative;
        flex: 1;
        overflow: hidden;
    }

    .highlight-pre,
    .highlight-pre code[class*="language-"] {
        margin: 0 !important;
        background: transparent !important;
        font-family: 'Consolas', 'Courier New', monospace !important;
        font-size: 14px !important;
        line-height: 1.6 !important;
        white-space: pre !important;
        tab-size: 4;
        text-shadow: none !important;
    }

    .highlight-pre {
        position: absolute;
        inset: 0;
        padding: 16px !important;
        overflow: hidden;
        pointer-events: none;
    }

    #editor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: transparent;
        caret-color: var(--accent);
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        line-height: 1.6;
        padding: 16px;
        border: none;
        outline: none;
        resize: none;
        tab-size: 4;
        white-space: pre;
    }

    #editor::placeholder {
        color: var(--text-muted);
        opacity: 1;
    }

    /* --- mobile warning overlay ---------------------------------------------- */
    .mobile-warning {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        text-align: center;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .mobile-warning.visible {
        visibility: visible;
        opacity: 1;
    }
</style>
</head>
<body>

    <div class="titlebar">
        <div class="titlebar-left">
            <div class="traffic-lights">
                <span class="red" id="redBtn" title="Close / Save with confirmation"></span>
                <span class="yellow"></span>
                <span class="green" id="greenBtn" title="Quick Save"></span>
            </div>
            <div class="titlebar-title">
                <strong>RagbaarNet</strong> —
                <input type="text" id="filenameInput" class="filename-input" value="session.js"
                    spellcheck="false" autocomplete="off" autocapitalize="off"
                    title="Click to rename (also picks the syntax highlighting)">
            </div>
        </div>
        <div class="status">
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="70">
                <span id="volumeLabel">70%</span>
            </div>
            <button class="icon-btn stop-btn" id="stopBtn" title="Start Music Engine">▶</button>
        </div>
    </div>

    <div class="tip-banner" id="tipBanner">
        <span>💡 <strong>Tip:</strong> Click the <strong>▶ Play button</strong> to start the music engine, and rename <strong>"session.js"</strong> to change syntax highlighting.</span>
        <button id="closeTipBtn" title="Dismiss tip">&times;</button>
    </div>

    <div class="editor-wrapper">
        <div class="gutter" id="gutter"><div>1</div></div>
        <div class="code-area">
            <pre id="highlightPre" class="highlight-pre" aria-hidden="true"><code id="highlightCode" class="language-javascript"></code></pre>
            <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
                placeholder=
"// Start typing and enjoy your performance! Each key press sends a NOTE_ON/NOTE_OFF to the processor.

function RagbaarNet(scene) {
    return generateMusic(scene);
}"
            ></textarea>
        </div>
    </div>

    <div class="statusbar">
        <div class="statusbar-group">
            <span>Last key: <strong id="lastKey">—</strong></span>
            <span class="note-count">Notes sent: <strong id="noteCount">0</strong></span>
            <span class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting…</span>
            </span>
        </div>
        <div class="held-keys" id="heldKeys"></div>
    </div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<script src="/ui/js/core.js"></script>
<script src="/ui/js/audio-engine.js"></script>
<script src="/ui/js/beat-generator.js"></script>
<script>
    // --- Syntax highlighting (Prism.js), driven entirely by the filename's extension
    Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';

    const LANGUAGE_BY_EXT = {
        py: 'python',
        cpp: 'cpp', cc: 'cpp', cxx: 'cpp', hpp: 'cpp', h: 'cpp',
        c: 'c',
        html: 'markup', htm: 'markup', xml: 'markup',
        js: 'javascript', jsx: 'javascript', ts: 'javascript', tsx: 'javascript',
        json: 'json', css: 'css', md: 'markdown', java: 'java', cs: 'csharp',
    };

    function detectLanguage(filename) {
        const ext = (filename.split('.').pop() || '').toLowerCase();
        return LANGUAGE_BY_EXT[ext] || 'javascript';
    }

    const highlightCode = document.getElementById('highlightCode');
    const highlightPre = document.getElementById('highlightPre');
    const filenameInput = document.getElementById('filenameInput');
    const editor = document.getElementById('editor');

    function updateHighlight() {
        highlightCode.className = `language-${detectLanguage(filenameInput.value)}`;
        highlightCode.textContent = editor.value + '\n';
        Prism.highlightElement(highlightCode);
    }

    function updateVolumeControls(vol) {
        currentVolume = clampVolumeValue(vol);
        const label = document.getElementById('volumeLabel');
        if (label) label.textContent = `${currentVolume}%`;

        const slider = document.getElementById('volumeSlider');
        if (slider) slider.value = currentVolume;

        if (masterGain) {
            masterGain.gain.rampTo(currentVolume / 100, 0.05);
        }
    }

    function handleVolumeSliderInput() {
        updateVolumeControls(this.value);
    }

    // --- Onboarding Tip Banner -------------------------------------------------
    const tipBanner = document.getElementById('tipBanner');
    const closeTipBtn = document.getElementById('closeTipBtn');

    if (tipBanner && closeTipBtn) {
        if (localStorage.getItem('ragbaar_tip_dismissed') === 'true') {
            tipBanner.style.display = 'none';
        }
        closeTipBtn.addEventListener('click', () => {
            tipBanner.style.display = 'none';
            localStorage.setItem('ragbaar_tip_dismissed', 'true');
        });
    }

    // --- Processor connection (same host-detection logic as the main UI) -----
    const processorUrl = detectProcessorUrl(); // from core.js
    const socket = io(processorUrl, {
        timeout: 10000,
        reconnection: true,
        reconnectionAttempts: 10,
        reconnectionDelay: 2000,
    });

    const statusDot = document.getElementById('statusDot');
    const statusTextEl = document.getElementById('statusText');

    // --- Mobile device check ---------------------------------------------------
    function checkDevice() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                         (window.innerWidth <= 768) ||
                         ('ontouchstart' in window);

        if (isMobile) {
            const warning = document.createElement('div');
            warning.className = 'mobile-warning visible';
            warning.innerHTML = `
                <div style="font-size: 64px; margin-bottom: 24px;">💻</div>
                <h1 style="font-size: 24px; margin-bottom: 16px;">Laptop Recommended</h1>
                <p style="font-size: 16px; line-height: 1.5; color: var(--text-muted); max-width: 400px; margin-bottom: 32px;">
                    RagbaarNet uses real-time LSTM models that require significant CPU power. Mid-level mobile phones may experience audio noise and performance issues.
                </p>
                <p style="font-size: 16px; line-height: 1.5; color: var(--text-muted); max-width: 400px; margin-bottom: 32px;">
                    For the best orchestral experience, please use a <strong>laptop or desktop computer</strong>.
                </p>
                <button id="ignoreMobileWarning" style="background: var(--accent); color: var(--bg-primary); border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer;">
                    Continue on Mobile (Performance may suffer)
                </button>
            `;
            document.body.appendChild(warning);

            document.getElementById('ignoreMobileWarning').addEventListener('click', () => {
                warning.style.opacity = '0';
                setTimeout(() => warning.remove(), 300);
            });
        }
    }
    checkDevice();

    socket.on('connect', () => {
        statusDot.classList.add('connected');
        statusTextEl.textContent = 'Connected — typing channel active';
    });

    socket.on('disconnect', () => {
        statusDot.classList.remove('connected');
        statusTextEl.textContent = 'Disconnected';
    });

    socket.on('connect_error', () => {
        statusTextEl.textContent = 'Connection error — is main.py running?';
    });

    let noteCount = 0;
    const noteCountEl = document.getElementById('noteCount');
    socket.on('music_update', (data) => {
        noteCount += (data.events_count || 0);
        noteCountEl.textContent = noteCount;
        handleMusicEvents(data); // from audio-engine.js
    });

    // --- Start-engine gesture --------------------------------------------------
    const stopBtn = document.getElementById('stopBtn');

    stopBtn.addEventListener('click', async () => {
        if (!isMusicGenerationActive) {
            try {
                await Tone.start();
                if (typeof initializeAudioSystem === 'function') {
                    initializeAudioSystem();
                }
                isMusicGenerationActive = true;
                Tone.Transport.bpm.value = currentTempo;
                Tone.Transport.start();
                if (typeof initBeatGenerator === 'function') initBeatGenerator();

                stopBtn.textContent = '■';
                stopBtn.title = 'Silence everything immediately';
                stopBtn.classList.add('playing');
                editor.focus();
                console.log('🎵 Audio engine started');
            } catch (err) {
                console.error('❌ Failed to start audio engine:', err);
                statusTextEl.textContent = 'Failed to start audio — see console';
            }
        } else {
            isMusicGenerationActive = false;
            Tone.Transport.stop();
            if (typeof hardStopAllAudio === 'function') hardStopAllAudio();
            if (typeof stopBeatGenerator === 'function') stopBeatGenerator();

            stopBtn.textContent = '▶';
            stopBtn.title = 'Start Music Engine';
            stopBtn.classList.remove('playing');
            console.log('🛑 Audio engine stopped');
        }
    });

    // --- Save functionality ----------------------------------------------------
    function saveFile() {
        const filename = filenameInput.value.trim() || 'session.txt';
        const blob = new Blob([editor.value], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    document.getElementById('redBtn').addEventListener('click', () => {
        if (confirm("Save the file?")) saveFile();
    });
    document.getElementById('greenBtn').addEventListener('click', saveFile);

    function resizeFilenameInput() {
        filenameInput.size = Math.max(6, filenameInput.value.length);
    }
    filenameInput.addEventListener('input', () => {
        resizeFilenameInput();
        updateHighlight();
    });
    resizeFilenameInput();

    // --- Keystroke capture -----------------------------------------------------
    const lastKeyEl = document.getElementById('lastKey');
    const heldKeysEl = document.getElementById('heldKeys');
    const heldKeys = new Set();

    function sendEvent(type, key) {
        socket.emit('input_event', {
            source: 'typing',
            payload: { type, key },
            timestamp: Date.now() / 1000,
        });
    }

    function renderHeldKeys() {
        heldKeysEl.innerHTML = Array.from(heldKeys)
            .map(k => `<span class="held-key">${k === ' ' ? 'space' : k}</span>`)
            .join('');
    }

    editor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.slice(0, start) + '\t' + editor.value.slice(end);
            editor.selectionStart = editor.selectionEnd = start + 1;
            scheduleRender();
        }

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            saveFile();
        }

        if (e.repeat) return;

        const key = e.key.toLowerCase();
        heldKeys.add(key);
        renderHeldKeys();
        lastKeyEl.textContent = e.key === ' ' ? 'space' : e.key;

        sendEvent('keydown', key);
    });

    editor.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        heldKeys.delete(key);
        renderHeldKeys();
        sendEvent('keyup', key);
    });

    editor.addEventListener('blur', () => {
        heldKeys.forEach(key => sendEvent('keyup', key));
        heldKeys.clear();
        renderHeldKeys();
        releaseScrollSoon.cancel();
        releaseMouseSoon.cancel();
    });

    // --- Scroll & Mouse gestures -----------------------------------------------
    function makeGestureTrigger(key, holdMs) {
        let isHeld = false;
        let releaseTimer = null;
        function trigger() {
            if (!isHeld) {
                isHeld = true;
                sendEvent('keydown', key);
            }
            clearTimeout(releaseTimer);
            releaseTimer = setTimeout(() => {
                isHeld = false;
                sendEvent('keyup', key);
            }, holdMs);
        }
        trigger.cancel = () => {
            clearTimeout(releaseTimer);
            if (isHeld) sendEvent('keyup', key);
            isHeld = false;
        };
        return trigger;
    }

    const releaseScrollSoon = makeGestureTrigger('scroll', 250);
    const releaseMouseSoon = makeGestureTrigger('mousemove', 350);

    editor.addEventListener('wheel', () => releaseScrollSoon(), { passive: true });

    let lastMouseSample = 0;
    editor.addEventListener('mousemove', () => {
        const now = Date.now();
        if (now - lastMouseSample < 80) return;
        lastMouseSample = now;
        releaseMouseSoon();
    });

    // --- Gutter & Highlighting sync --------------------------------------------
    const gutter = document.getElementById('gutter');
    let lastGutterLineCount = -1;

    function updateGutter() {
        const lineCount = editor.value.split('\n').length;
        if (lineCount === lastGutterLineCount) return;
        lastGutterLineCount = lineCount;
        let html = '';
        for (let i = 1; i <= lineCount; i++) html += `<div>${i}</div>`;
        gutter.innerHTML = html;
    }

    let renderScheduled = false;
    function scheduleRender() {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(() => {
            renderScheduled = false;
            updateGutter();
            updateHighlight();
        });
    }

    editor.addEventListener('input', scheduleRender);
    editor.addEventListener('scroll', () => {
        gutter.scrollTop = editor.scrollTop;
        highlightPre.scrollTop = editor.scrollTop;
        highlightPre.scrollLeft = editor.scrollLeft;
    });

    updateGutter();
    updateHighlight();
</script>

</body>
</html>
